<!DOCTYPE html>
<html lang="ru">
<head>
<script src="bridge.js"></script>
<meta charset="utf-8">
<title>GTA 6 — Топ-6 (по очереди)</title>
<link rel="stylesheet" href="gta.css">
<style>
  /* Recommended source: 480×37. */
  body { width: 480px; height: 37px; }
  .stage { position: relative; width: 480px; height: 37px; }
  .slide { position: absolute; inset: 0; opacity: 0; transition-property: opacity; transition-timing-function: linear; }
  .slide.on { opacity: 1; }
</style>
</head>
<body>
  <div class="stage" id="stage" role="group" aria-label="Топ-6 донатеров марафона"></div>
<script src="gta-top.js"></script>
<script>
(function () {
  'use strict';
  var LABEL = 'Топ-6 донатеров';
  var stage = document.getElementById('stage');
  var slides = [];
  var index = 0;
  var key = '';
  var slideMs = 10000;
  var fadeMs = 600;
  var timer = 0;

  /** Shows slide `i`, cross-fading from the current one. */
  function show(i) {
    slides.forEach(function (s, n) {
      s.style.transitionDuration = fadeMs + 'ms';
      s.classList.toggle('on', n === i);
    });
  }

  /** (Re)starts the countdown to the next slide with the current display time. */
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(tick, slideMs);
  }

  /** Advances the rotation to the next donor. */
  function tick() {
    if (slides.length > 1) {
      index = (index + 1) % slides.length;
      show(index);
    }
    schedule();
  }

  function apply(snapshot) {
    var meta = snapshot && snapshot.meta;
    if (!meta) return;
    GtaTop.applyBackground(meta, 'topRotate');
    if (meta.gta) {
      var nextSlide = Math.max(1000, Math.round(Number(meta.gta.topSlideSeconds) * 1000) || 10000);
      fadeMs = Math.max(0, Math.round(Number(meta.gta.topFadeSeconds) * 1000) || 0);
      // A changed display time applies right away instead of after the old (possibly long) wait.
      if (nextSlide !== slideMs) {
        slideMs = nextSlide;
        if (timer) schedule();
      }
    }
    var top = (meta.top || []).slice(0, 6);
    var next = top.map(function (r) { return r.name; }).join('\u0001');
    if (next === key) return;
    var current = slides[index] && slides[index].dataset.name;
    key = next;
    stage.innerHTML = '';
    slides = top.map(function (r, n) {
      var wrap = document.createElement('div');
      wrap.className = 'slide';
      wrap.dataset.name = r.name;
      wrap.appendChild(GtaTop.row(n + 1, r.name, LABEL));
      stage.appendChild(wrap);
      return wrap;
    });
    // Keep showing the same donor when the order changes, otherwise restart from #1.
    var keep = slides.findIndex(function (s) { return s.dataset.name === current; });
    index = keep >= 0 ? keep : 0;
    if (slides.length) {
      slides[index].style.transitionDuration = '0ms';
      void slides[index].offsetWidth;
      slides[index].classList.add('on');
    }
    if (!timer) schedule();
  }

  DonateTimerBridge.on(apply);
})();
</script>
</body>
</html>
